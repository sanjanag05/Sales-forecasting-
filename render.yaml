services:
  - type: web
    name: sales-forecasting
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: PORT
        value: 5001
      - key: GROQ_API_KEY
        sync: false
